name: Semver Tags Release
description: "Verify a CI release tag, build every platform archive, and publish the release."

on:
  events:
    - tag_created
  branches:
    - "v*"

jobs:
  prepare:
    job_file: release-control.yaml
    environment:
      SEMVER_TAGS_RELEASE_JOB: prepare

  cli-linux-amd64:
    job_file: release-cli.yaml
    depends_on:
      - prepare
    environment:
      SEMVER_TAGS_RELEASE_PLATFORM: linux/amd64

  cli-linux-arm64:
    job_file: release-cli.yaml
    depends_on:
      - prepare
    environment:
      SEMVER_TAGS_RELEASE_PLATFORM: linux/arm64

  cli-darwin-amd64:
    job_file: release-cli.yaml
    depends_on:
      - prepare
    environment:
      SEMVER_TAGS_RELEASE_PLATFORM: darwin/amd64

  cli-darwin-arm64:
    job_file: release-cli.yaml
    depends_on:
      - prepare
    environment:
      SEMVER_TAGS_RELEASE_PLATFORM: darwin/arm64

  cli-windows-amd64:
    job_file: release-cli.yaml
    depends_on:
      - prepare
    environment:
      SEMVER_TAGS_RELEASE_PLATFORM: windows/amd64

  cli-windows-arm64:
    job_file: release-cli.yaml
    depends_on:
      - prepare
    environment:
      SEMVER_TAGS_RELEASE_PLATFORM: windows/arm64

  publish:
    job_file: release-control.yaml
    depends_on:
      - cli-linux-amd64
      - cli-linux-arm64
      - cli-darwin-amd64
      - cli-darwin-arm64
      - cli-windows-amd64
      - cli-windows-arm64
    environment:
      SEMVER_TAGS_RELEASE_JOB: publish
