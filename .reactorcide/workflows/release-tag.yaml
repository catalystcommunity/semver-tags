name: Semver Tags Release Tag
description: "Calculate and push the next release tag after a pull request merge."

# This workflow only creates the draft release and pushes the tag. The pushed
# tag then starts the release workflow, which builds and publishes.
on:
  events:
    - pull_request_merged
  branches:
    - main

jobs:
  tag:
    job_file: release-control.yaml
    environment:
      SEMVER_TAGS_RELEASE_JOB: tag
