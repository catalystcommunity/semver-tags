name: conventional-commits
description: "Validate all pull-request commits with the conventional commit format"
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: "runnerlib run --job-command true"
  timeout: 300
  priority: 10
  working_dir: /job
environment:
  SEMVER_TAGS_CI_JOB: conventional-commits
run_local:
  user: host
