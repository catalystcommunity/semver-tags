name: dry-run
description: "Run semver-tags against its own repository without writing tags"
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: "runnerlib run --job-command true"
  timeout: 900
  priority: 10
  working_dir: /job
environment:
  SEMVER_TAGS_CI_JOB: dry-run
run_local:
  user: host
